# Zensical docs site configuration - https://zensical.org/docs/
# Kept in lockstep with the pinned `zensical` version in the justfile.

[project]
site_name = "git-redate"
site_description = "Interactively edit git commit dates from a modern terminal UI, rewriting history with gitoxide."
site_author = "qq88976321"
site_url = "https://qq88976321.github.io/git-redate/"
repo_url = "https://github.com/qq88976321/git-redate"
repo_name = "qq88976321/git-redate"
copyright = """
Copyright &copy; 2026 qq88976321 - <a href="https://github.com/qq88976321/git-redate/blob/master/LICENSE">MIT licensed</a>
"""

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Usage" = "usage.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/qq88976321/git-redate"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
