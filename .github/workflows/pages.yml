# GitHub Pages: build the Zensical docs site in website/ and deploy it.
#
# ONE-TIME MANUAL STEP (repo owner): GitHub -> Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions".
#
# STATUS: UNVERIFIED - never executed (no remote/Pages yet). Verify on
# the first push after Pages is enabled, then delete this status block.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # Pinned; keep in lockstep with the `zensical` version in justfile.
      - run: pip install zensical==0.0.47
      - name: Build the site
        working-directory: website
        run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/site
      - uses: actions/deploy-pages@v5
        id: deployment
