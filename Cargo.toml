[package]
name = "git-redate"
version = "0.1.0"
edition = "2021"
description = "Interactively edit git commit dates from a modern terminal UI"
license = "MIT"
# MSRV floor. gitoxide (gix 0.85) requires Rust 1.85, which sets the
# minimum for the whole crate. The local toolchain is newer; the CI
# msrv job stays commented until a 1.85 build is verified (mirrors the
# CL-05 approach in herdr-copy-search).
rust-version = "1.85"

# Invoked as `git redate`: git dispatches the `redate` subcommand to a
# `git-redate` binary on PATH, so the bin name must be exactly this.
[[bin]]
name = "git-redate"
path = "src/main.rs"

# Lint policy lives here, not in source attributes.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Minimal feature set: object read/write, refs, and config are core;
# `sha1` is the hash backend, `revision` powers rev-parse, and `status`
# backs the dirty-worktree notice. The heavy defaults (blame, mailmap,
# worktree-mutation, max-performance/zlib-ng) are dropped.
gix = { version = "0.85", default-features = false, features = [
    "sha1",
    "revision",
    "status",
] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
ratatui = "0.30"
thiserror = "2"

[profile.release]
lto = true
strip = true
